name: IPTV Playlist Generator

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir
  workflow_dispatch:  # Manuel çalıştırma

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg python3-pip
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install requests pycryptodomex
    
    - name: Install and update yt-dlp
      run: |
        sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp
        yt-dlp -U
    
    - name: Create config.json if not exists
      run: |
        if [ ! -f config.json ]; then
          echo '{
            "cloudflare": {
              "account_id": "${{ secrets.CF_ACCOUNT_ID }}",
              "api_token": "${{ secrets.CF_API_TOKEN }}",
              "worker_name": "${{ secrets.CF_WORKER_NAME }}",
              "worker_url": "${{ secrets.CF_WORKER_URL }}"
            },
            "pythonanywhere": {
              "upload_url": "${{ secrets.PA_UPLOAD_URL }}",
              "token": "${{ secrets.PA_TOKEN }}"
            }
          }' > config.json
        fi
    
    - name: Run IPTV generator
      env:
        YTDLP_NO_UPDATE: 'True'  # Otomatik güncellemeyi devre dışı bırak
      run: python Cloud.py
    
    - name: Upload generated files
  uses: actions/upload-artifact@v4
  with:
    name: iptv-files
    path: |
      TV.m3u
      *.txt
