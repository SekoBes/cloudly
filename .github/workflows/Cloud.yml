name: IPTV Otomatik Guncelleme

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yt-dlp


      - name: Scripti Calistir
        run: python Cloud.py
